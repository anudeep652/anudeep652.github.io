<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0891b2" />
    <title>404 — Page not found · Anudeep S</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231c1917'/%3E%3Ctext x='50' y='66' font-family='ui-monospace,Menlo,monospace' font-size='52' font-weight='700' text-anchor='middle' fill='%230891b2'%3EA%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/style.css" />
    <style>
      .err-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .err-code {
        font-family: "JetBrains Mono", monospace;
        font-size: clamp(5rem, 18vw, 10rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #0891b2, #22d3ee, #7c3aed);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
        margin-bottom: 16px;
      }
      .err-title {
        font-size: clamp(1.4rem, 3vw, 2rem);
        margin-bottom: 12px;
      }
      .err-sub {
        color: var(--text-dim);
        max-width: 460px;
        margin: 0 auto 28px;
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="err-wrap">
      <div>
        <div class="err-code">404</div>
        <h1 class="err-title">Looks like this page wandered off.</h1>
        <p class="err-sub">
          The page you're looking for doesn't exist — but plenty of other cool
          stuff does.
        </p>
        <a class="btn btn-primary" href="/">← Back to home</a>
      </div>
    </main>
  </body>
</html>
